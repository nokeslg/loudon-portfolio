<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benighted Performance Check</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#07100F;color:#CFDEDB;font:15px/1.6 ui-monospace,"SF Mono",Menlo,monospace;padding:34px}
h1{font:600 19px/1.3 ui-monospace,monospace;color:#D9A05B;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
p.sub{color:#5D7A77;margin-bottom:26px;font-size:13px;max-width:70ch}
table{border-collapse:collapse;width:100%;max-width:900px;margin-bottom:26px}
td{padding:7px 12px;border-bottom:1px solid #17302F;vertical-align:top}
td:first-child{color:#5D7A77;width:220px}
.good{color:#6FCF97}.bad{color:#FF6B6B}.warn{color:#E8C468}
#verdict{max-width:900px;padding:18px 20px;border:1px solid #1B3A3B;background:#0A1C1D;margin-bottom:26px;white-space:pre-wrap}
#copy{font:inherit;color:#07100F;background:#D9A05B;border:0;padding:10px 20px;cursor:pointer}
#copy:focus-visible{outline:2px solid #CFDEDB;outline-offset:2px}
canvas{display:none;position:absolute;inset:0}
</style>
</head>
<body>
<h1>Benighted performance check</h1>
<p class="sub">Open this in the browser that feels slow, at the window size you normally play at, and leave it alone for about ten seconds.</p>
<div id="verdict">measuring…</div>
<table id="out"></table>
<button id="copy">Copy the results</button>

<script>
const rows = [];
function row(k, v, cls){ rows.push([k, String(v), cls || '']); }

/* ---- what the browser is ---- */
row('browser', navigator.userAgent.replace(/^Mozilla\/5\.0 /, ''));
row('window (CSS px)', innerWidth + ' x ' + innerHeight);
row('devicePixelRatio', devicePixelRatio);
const mp = innerWidth * innerHeight * devicePixelRatio * devicePixelRatio / 1e6;
row('pixels on screen', mp.toFixed(1) + ' MP');

/* ---- is the GPU actually doing the work? ---- */
let renderer = 'no WebGL at all', software = true;
try {
  const gl = document.createElement('canvas').getContext('webgl');
  if (gl) {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    renderer = (dbg && gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) || gl.getParameter(gl.RENDERER) || 'hidden';
    software = /swiftshader|software|llvmpipe|basic render/i.test(renderer);
  }
} catch (e) { renderer = 'threw: ' + e.message; }
row('graphics renderer', renderer, software ? 'bad' : 'good');

/* ---- how fast does this page get frames at all? ---- */
function measure(ms, work) {
  return new Promise(res => {
    const gaps = []; let last = performance.now(); const t0 = last;
    (function tick(x) {
      gaps.push(x - last); last = x;
      if (work) work();
      if (x - t0 < ms) requestAnimationFrame(tick);
      else {
        gaps.shift();
        const s = gaps.slice().sort((a, b) => a - b);
        const mean = gaps.reduce((a, b) => a + b, 0) / gaps.length;
        res({
          fps: +(1000 / mean).toFixed(1),
          median: +s[Math.floor(s.length / 2)].toFixed(1),
          worst: +s[s.length - 1].toFixed(1)
        });
      }
    })(performance.now());
  });
}

/* the game's actual shape of work: N full-window canvases, each redrawn every frame */
function makeCanvases(n) {
  const list = [];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('canvas');
    c.width = Math.round(innerWidth * devicePixelRatio);
    c.height = Math.round(innerHeight * devicePixelRatio);
    c.style.width = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
    document.body.appendChild(c);
    list.push(c);
  }
  return list;
}
const src = document.createElement('canvas');
src.width = 1200; src.height = 600;
{
  const g = src.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 1200, 600);
  grad.addColorStop(0, '#16302f'); grad.addColorStop(1, '#2a4a3f');
  g.fillStyle = grad; g.fillRect(0, 0, 1200, 600);
}

(async function () {
  const idle = await measure(1200, null);
  row('idle, nothing drawn', idle.fps + ' fps  (median ' + idle.median + 'ms, worst ' + idle.worst + 'ms)',
      idle.fps > 50 ? 'good' : 'bad');

  let k = 0;
  function drawInto(list) {
    k++;
    const dx = (k % 40) - 20;
    for (const c of list) {
      const g = c.getContext('2d');
      g.clearRect(0, 0, c.width, c.height);
      g.drawImage(src, dx, 0, c.width * 1.6, c.height);
    }
  }

  const one = makeCanvases(1);
  one.forEach(c => c.style.display = 'block');
  const r1 = await measure(1500, () => drawInto(one));
  one.forEach(c => c.remove());
  row('1 full-window canvas', r1.fps + ' fps  (median ' + r1.median + 'ms)', r1.fps > 50 ? 'good' : 'bad');

  const five = makeCanvases(5);
  five.forEach(c => c.style.display = 'block');
  const r5 = await measure(1500, () => drawInto(five));
  five.forEach(c => c.remove());
  row('5 full-window canvases', r5.fps + ' fps  (median ' + r5.median + 'ms)', r5.fps > 50 ? 'good' : 'bad');
  row('(5 is the game)', 'Benighted composites five parallax layers every frame');

  /* ---- say what it means ---- */
  let verdict;
  if (software) {
    verdict = 'HARDWARE ACCELERATION IS OFF.\n\n'
      + 'The graphics renderer above is a software rasteriser, which means this\n'
      + 'browser is drawing every pixel on the CPU. Five full-window canvases is\n'
      + 'far more than that can do, and no change to the game will fix it.\n\n'
      + 'Chrome: Settings > System > "Use graphics acceleration when available".\n'
      + 'Turn it on and restart the browser. If this is Safari, there is no such\n'
      + 'switch, so open the same page in Chrome to compare.';
  } else if (idle.fps < 50) {
    verdict = 'THE PAGE IS SLOW BEFORE THE GAME DRAWS ANYTHING.\n\n'
      + 'An empty animation loop is only managing ' + idle.fps + ' fps, so something outside\n'
      + 'the game is holding the browser back: another tab, a screen recording or\n'
      + 'share, a second display, or low power mode. Try one fresh window with\n'
      + 'nothing else open.';
  } else if (r5.fps < 40 && r1.fps > 50) {
    verdict = 'IT IS THE NUMBER OF LAYERS.\n\n'
      + 'One canvas runs at ' + r1.fps + ' fps and five runs at ' + r5.fps + '. That is the game\'s\n'
      + 'exact shape, so the fix belongs in the renderer: fewer or smaller\n'
      + 'canvases. Send this to Claude and it knows what to change.';
  } else if (r1.fps < 40) {
    verdict = 'EVEN ONE FULL-WINDOW CANVAS IS SLOW (' + r1.fps + ' fps).\n\n'
      + 'At ' + mp.toFixed(1) + ' megapixels this browser cannot push one layer, let alone five.\n'
      + 'A smaller window will help straight away. Send this to Claude either way.';
  } else {
    verdict = 'THIS MACHINE LOOKS FINE: ' + r5.fps + ' fps on the game\'s workload.\n\n'
      + 'If Benighted itself is still at 9 fps, the cause is something the game is\n'
      + 'doing rather than what the browser can do. Send this to Claude and say\n'
      + 'which page you measured 9 fps on.';
  }
  document.getElementById('verdict').textContent = verdict;

  document.getElementById('out').innerHTML = rows
    .map(([k, v, c]) => '<tr><td>' + k + '</td><td class="' + c + '">' + v + '</td></tr>')
    .join('');
})();

document.getElementById('copy').addEventListener('click', () => {
  const text = document.getElementById('verdict').textContent + '\n\n'
    + rows.map(([k, v]) => k + ': ' + v).join('\n');
  navigator.clipboard.writeText(text).then(
    () => { document.getElementById('copy').textContent = 'copied — paste it to Claude'; },
    () => { document.getElementById('copy').textContent = 'copy failed — screenshot it instead'; }
  );
});
</script>
</body>
</html>
