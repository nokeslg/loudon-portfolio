<!-- THIS USED TO HOST THE GAME IN AN IFRAME, and that is the one structural
     difference between the copy on this site and the copy Loudon runs from
     localhost -- which is the one that felt faster. The code is byte
     identical, so the container was the only variable left. An iframe is a
     second document with its own compositing layer over the whole screen, and
     the cost of that scales with the display: free on a 1024x768 pane,
     something you can feel on a Retina one.

     So the game runs as a top-level document now, exactly as it does on
     localhost. This address is kept because it may already have been shared;
     it replaces itself in history rather than redirecting, so the back button
     still goes where the player came from instead of bouncing off a redirect. -->
